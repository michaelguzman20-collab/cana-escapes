      rel="stylesheet"
    />

    <!-- Structured data: business / travel agency -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Cana Escapes",
        "description": "Alquiler vacacional y gestión integral de propiedades en Bávaro y Punta Cana, República Dominicana.",
        "url": "https://canaescapes.com/",
        "logo": "https://canaescapes.com/apple-touch-icon.png",
        "image": "https://canaescapes.com/og-image.jpg",
        "email": "michael@canaescapes.com",
        "telephone": "+1-809-210-2773",
        "areaServed": ["Punta Cana", "Bávaro", "República Dominicana"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Punta Cana",
          "addressRegion": "La Altagracia",
          "addressCountry": "DO"
        },
        "sameAs": ["https://instagram.com/canaescapes"]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Visible before React mounts; React replaces this automatically -->
      <div style="min-height:100svh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef3f9,#f0f6ff,#e8f0f8);font-family:Inter,sans-serif;">
        <div style="text-align:center;color:#2D6A9F;">
          <div style="width:36px;height:36px;border:3px solid #2D6A9F;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
          <p style="font-size:13px;opacity:0.7;">Cargando…</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <script>
        // "/" y "/tours" tienen su propia intro animada: el aviso previo queda liso (blanco / azul Tours 360)
        (function () {
          var p = location.pathname, el = document.querySelector("#root > div");
          if (!el || (p !== "/" && p !== "/tours")) return;
          el.innerHTML = "";
          el.style.background = p === "/" ? "#fff" : "#0F2B4C";
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
