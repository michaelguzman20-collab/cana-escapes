<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0F2B4C"/>

  <!-- Compass arc (half circle) -->
  <path d="M 14 36 A 18 18 0 0 1 50 36" stroke="#F0A030" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Compass tick marks -->
  <!-- Top (N) -->
  <line x1="32" y1="11" x2="32" y2="17" stroke="#F0A030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left diagonal -->
  <line x1="17" y1="20" x2="20.5" y2="24.5" stroke="#F0A030" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right diagonal -->
  <line x1="47" y1="20" x2="43.5" y2="24.5" stroke="#F0A030" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Sun (half circle) -->
  <path d="M 18 36 A 14 14 0 0 1 46 36 Z" fill="#F0A030"/>

  <!-- Horizon lines -->
  <line x1="8"  y1="36" x2="56" y2="36" stroke="#2D6A9F" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="40" x2="48" y2="40" stroke="#2D6A9F" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="21" y1="44" x2="43" y2="44" stroke="#2D6A9F" stroke-width="1.1" stroke-linecap="round"/>

  <!-- N label -->
  <text x="32" y="10" font-family="serif" font-size="6" fill="#F0A030" text-anchor="middle" font-weight="bold">N</text>
</svg>
